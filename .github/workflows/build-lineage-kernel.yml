name: Build LineageOS giuliac kernel (KSU+SUSFS)

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: 'LOCALVERSION pin (must match running kernel)'
        default: '-g311084c0cf6d'
      susfs_ref:
        description: 'susfs4ksu branch'
        default: 'gki-android14-6.1'
      ksu_ref:
        description: 'KernelSU-Next branch'
        default: 'next'

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime
  CCACHE_MAXSIZE: 4G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            python3 git curl zstd lld llvm clang ccache cpio rsync device-tree-compiler

      - name: Cache kernel source
        uses: actions/cache@v4
        with:
          path: kernel
          key: ksrc-lineage-23.2-v1
          restore-keys: |
            ksrc-lineage-23.2-

      - name: Clone LineageOS kernel
        run: |
          if [ ! -d kernel/.git ]; then
            git clone --depth 1 -b lineage-23.2 \
              https://github.com/LineageOS/android_kernel_oneplus_sm8650 kernel
          fi
          cd kernel && git rev-parse HEAD

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.localversion }}-${{ inputs.susfs_ref }}-${{ inputs.ksu_ref }}-v1
          restore-keys: |
            ccache-${{ inputs.localversion }}-${{ inputs.susfs_ref }}-${{ inputs.ksu_ref }}-
            ccache-

      - name: Fetch external modules and build overlay
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          if [ ! -d ext/.git ]; then
            git clone --depth 1 -b lineage-23.2 \
              https://github.com/LineageOS/android_kernel_oneplus_sm8650-modules ext
          fi
          python3 - <<'PYEOF'
          import os, re, shutil

          K = "kernel"
          E = "ext"

          # index dirs by basename
          def index(root):
              idx = {}
              for dp, dns, fns in os.walk(root):
                  for d in dns:
                      idx.setdefault(d, []).append(os.path.join(dp, d))
              return idx

          kidx = index(K)
          eidx = index(E)

          missing = []
          for dp, dns, fns in os.walk(K):
              if ".git" in dp or "/out" in dp:
                  continue
              for f in fns:
                  if not f.startswith("Kconfig"):
                      continue
                  path = os.path.join(dp, f)
                  try:
                      txt = open(path, encoding="utf-8", errors="ignore").read()
                  except Exception:
                      continue
                  for m in re.finditer(r'^\s*source\s+"([^"]+)"', txt, re.M):
                      src = m.group(1)
                      if "$" in src:
                          continue
                      full = os.path.normpath(os.path.join(dp, src))
                      if not os.path.exists(full):
                          missing.append(full)

          missing = sorted(set(missing))
          unresolved = []
          for full in missing:
              base = os.path.basename(full)
              cands = kidx.get(base, []) + eidx.get(base, [])
              cands = [c for c in cands if not os.path.exists(full)]
              if len(cands) == 1:
                  os.makedirs(os.path.dirname(full), exist_ok=True)
                  os.symlink(os.path.abspath(cands[0]), full)
                  print("LINK", full, "->", cands[0])
              elif len(cands) > 1:
                  # prefer path sharing last two components
                  tail = "/".join(full.split("/")[-2:])
                  pref = [c for c in cands if c.endswith(tail)]
                  pick = pref[0] if pref else cands[0]
                  os.makedirs(os.path.dirname(full), exist_ok=True)
                  os.symlink(os.path.abspath(pick), full)
                  print("LINK*", full, "->", pick)
              else:
                  unresolved.append(full)

          print("unresolved:", len(unresolved))
          for u in unresolved:
              print("  MISS", u)
          PYEOF

      - name: Integrate KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ inputs.ksu_ref }}/kernel/setup.sh" | bash -s "${{ inputs.ksu_ref }}" || \
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Apply SUSFS patches
        run: |
          cd kernel
          rm -rf ../susfs
          git clone --depth 1 -b "${{ inputs.susfs_ref }}" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs
          ls ../susfs/kernel_patches
          PATCH=$(ls ../susfs/kernel_patches/*.patch | head -1)
          echo "selected: $PATCH"
          patch -p1 --forward < "$PATCH"
          grep -rn "KSU_SUSFS" fs/Makefile | head -2

      - name: Configure
        run: |
          cd kernel
          mkdir -p out
          make O=out ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/oplus/pineapple_GKI.config
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          grep -E "CONFIG_KSU=|CONFIG_KSU_SUSFS=" out/.config || true

      - name: Build Image
        run: |
          cd kernel
          make O=out ARCH=arm64 LLVM=1 CC="ccache clang" LOCALVERSION="${{ inputs.localversion }}" \
            Image -j"$(nproc)" 2>&1 | tail -30
          ccache -s | tail -8
          ls -l out/arch/arm64/boot/Image

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
