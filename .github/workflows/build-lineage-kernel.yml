name: Build LineageOS giuliac kernel (KSU+SUSFS)

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: 'LOCALVERSION pin (must match running kernel)'
        default: '-g311084c0cf6d'
      susfs_ref:
        description: 'susfs4ksu branch'
        default: 'gki-android14-6.1'
      ksu_ref:
        description: 'KernelSU-Next branch'
        default: 'next'

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime
  CCACHE_MAXSIZE: 4G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            python3 git curl zstd lld llvm clang ccache cpio rsync device-tree-compiler

      - name: Cache kernel source
        uses: actions/cache@v4
        with:
          path: kernel
          key: ksrc-lineage-23.2-v1
          restore-keys: |
            ksrc-lineage-23.2-

      - name: Clone LineageOS kernel
        run: |
          if [ ! -d kernel/.git ]; then
            git clone --depth 1 -b lineage-23.2 \
              https://github.com/LineageOS/android_kernel_oneplus_sm8650 kernel
          fi
          cd kernel && git rev-parse HEAD

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.localversion }}-${{ inputs.susfs_ref }}-${{ inputs.ksu_ref }}-v1
          restore-keys: |
            ccache-${{ inputs.localversion }}-${{ inputs.susfs_ref }}-${{ inputs.ksu_ref }}-
            ccache-

      - name: Fetch external modules
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -d ext/.git ]; then
            git clone --depth 1 -b lineage-23.2 \
              https://github.com/LineageOS/android_kernel_oneplus_sm8650-modules ext
          fi
          ln -sfn "$PWD/ext/oplus/kernel/touchpanel/kernelFwUpdate" kernel/drivers/base/kernelFwUpdate
          ln -sfn "$PWD/ext/oplus/kernel/touchpanel/touchpanel_notify" kernel/drivers/base/touchpanel_notify
          ls -l kernel/drivers/base/kernelFwUpdate kernel/drivers/base/touchpanel_notify

      - name: Integrate KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ inputs.ksu_ref }}/kernel/setup.sh" | bash -s "${{ inputs.ksu_ref }}" || \
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Apply SUSFS patches
        run: |
          cd kernel
          rm -rf ../susfs
          git clone --depth 1 -b "${{ inputs.susfs_ref }}" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs
          ls ../susfs/kernel_patches
          PATCH=$(ls ../susfs/kernel_patches/*.patch | head -1)
          echo "selected: $PATCH"
          patch -p1 --forward < "$PATCH"
          grep -rn "KSU_SUSFS" fs/Makefile | head -2

      - name: Configure
        run: |
          cd kernel
          mkdir -p out
          make O=out ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/oplus/pineapple_GKI.config
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          grep -E "CONFIG_KSU=|CONFIG_KSU_SUSFS=" out/.config || true

      - name: Build Image
        run: |
          cd kernel
          make O=out ARCH=arm64 LLVM=1 CC="ccache clang" LOCALVERSION="${{ inputs.localversion }}" \
            Image -j"$(nproc)" 2>&1 | tail -30
          ccache -s | tail -8
          ls -l out/arch/arm64/boot/Image

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
